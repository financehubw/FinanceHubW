<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The scoreboard</title>
<link rel="stylesheet" href="../../../fonts/fonts.css">
<style>html,body{margin:0;background:#FFFFFF}</style>
</head>
<body>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; position: relative; background: #FFFFFF; color: #141311; font-family: 'Schibsted Grotesk', sans-serif; display: flex; flex-direction: column">
  <div style="display: flex; justify-content: space-between; align-items: center; background: #FA5B3C; color: #141311; padding: 20px 72px; font-size: 24px; font-weight: 800; letter-spacing: 0.12em"><div style="font-family: 'Bodoni Moda', serif; font-style: italic; font-weight: 900; font-size: 44px; letter-spacing: -0.01em; line-height: 1">The Daily</div><div>FRI 9 OCT 2026</div></div>
  <div style="flex: 1 1 0; box-sizing: border-box; padding: 56px 72px 64px; display: flex; flex-direction: column; justify-content: space-between">
    <div style="font-size: 22px; font-weight: 800; letter-spacing: 0.14em; color: #B4280E">THE SCOREBOARD</div>
    <div style="font-weight: 800; font-size: 96px; line-height: 0.95; letter-spacing: -0.04em">US shares, all up</div>
    <div style="display: flex; flex-direction: column; border-top: 6px solid #141311">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 20px; padding: 26px 0; border-bottom: 2px solid #C9C6C0">
        <div style="display: flex; flex-direction: column"><div style="font-size: 44px; font-weight: 800">S&amp;P 500</div><div style="font-size: 26px; color: #474742">closed at 7,812</div></div>
        <div style="font-weight: 800; font-size: 128px; line-height: 1; letter-spacing: -0.04em; color: #0B6B3A">+0.6%</div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 20px; padding: 26px 0; border-bottom: 2px solid #C9C6C0">
        <div style="display: flex; flex-direction: column"><div style="font-size: 44px; font-weight: 800">Dow Jones</div><div style="font-size: 26px; color: #474742">closed at 51,655</div></div>
        <div style="font-weight: 800; font-size: 128px; line-height: 1; letter-spacing: -0.04em; color: #0B6B3A">+0.8%</div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 20px; padding: 26px 0; border-bottom: 2px solid #C9C6C0">
        <div style="display: flex; flex-direction: column"><div style="font-size: 44px; font-weight: 800">Nasdaq</div><div style="font-size: 26px; color: #474742">closed at 27,366</div></div>
        <div style="font-weight: 800; font-size: 128px; line-height: 1; letter-spacing: -0.04em; color: #0B6B3A">+0.6%</div>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: 700; letter-spacing: 0.14em"><div>NEXT: MOVER OF THE DAY →</div><div>@FINANCEHUBW · 3 / 6</div></div>
  </div>
  <div style="position: absolute; left: 0; bottom: 0; width: 50.00%; height: 14px; background: #141311" aria-hidden="true"></div>
</div>
</body>
</html>
