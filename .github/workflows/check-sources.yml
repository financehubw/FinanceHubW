name: Check news sources

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 08:30 IST

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none            # don't download the Short videos: this job never uses them
          sparse-checkout: |
            /*
            !/site/media/shorts/*.mp4
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python xbot/check_feeds.py
