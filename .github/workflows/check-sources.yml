name: Check news sources

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 08:30 IST

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python check_feeds.py
