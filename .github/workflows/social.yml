name: Post Short

on:
  schedule:
    # Target 8:30 PM IST = 15:00 UTC = 11 AM New York = 4 PM London: India's evening peak and the
    # US late-morning Reels/Shorts peak in one slot. Two early triggers (GitHub often starts late);
    # the job waits until 15:00 UTC, and whichever runs second sees today's post and does nothing.
    # The posting time comes from social/best_times.json (learned weekly from the account's reach).
    # Checks only around the two slots (10:13 AM-1:13 PM and 7:13-9:13 PM IST); each run posts only if it is within 25 minutes of the
    # chosen time (waiting for the exact minute), otherwise it exits in seconds.
    - cron: "43 * * * *"   # hourly: GitHub delays and drops scheduled runs, so give it many chances
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (don't post)"
        type: boolean
        default: false
      backfill_only:
        description: "Only catch up platforms that missed recent Shorts"
        type: boolean
        default: false
      rethumb:
        description: "Apply cover thumbnails to already-posted Shorts"
        type: boolean
        default: false
      url_check:
        description: "HEAD-check a site path"
        type: string
        default: ""
      yt_stats:
        description: "Fetch YouTube view counts"
        type: boolean
        default: false
      make_thumbs:
        description: "Redraw every Short thumbnail (uses Pixabay photos)"
        type: boolean
        default: false
      thumb_files:
        description: "Only these files (space separated), optional"
        type: string
        default: ""
      ig_list:
        description: "List recent Instagram posts"
        type: boolean
        default: false
      photo_check:
        description: "Only test the photo source"
        type: boolean
        default: false
      ig_delete:
        description: "Instagram media id to delete"
        type: string
        default: ""
      fb_check:
        description: "Only diagnose the Facebook connection"
        type: boolean
        default: false
      from_clock:
        description: "Started by the Clock workflow: post only if a slot is due"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests google-api-python-client google-auth pillow
      - name: URL check
        if: inputs.url_check != ''
        run: |
          for p in ${{ inputs.url_check }}; do echo "$p $(curl -s -o /dev/null -w '%{http_code} %{content_type}' -I https://financehubw-site.vercel.app/$p)"; done | tee logs/url_check.txt
      - name: YouTube stats
        if: inputs.yt_stats
        run: python social/yt_stats.py
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      - name: Redraw thumbnails
        if: inputs.make_thumbs
        run: python social/thumbs.py ${{ inputs.thumb_files }}
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      - name: List Instagram posts
        if: inputs.ig_list
        run: |
          curl -s "https://graph.facebook.com/v21.0/$IG_USER_ID/media?fields=id,media_type,timestamp,caption&limit=10&access_token=$META_TOKEN" \
            | python -c "import sys,json; d=json.load(sys.stdin); [print(m['id'], m['media_type'], m['timestamp'], (m.get('caption') or '')[:50].replace(chr(10),' ')) for m in d.get('data',[])] or print(d)" | tee logs/ig_list.txt
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: Photo source check
        if: inputs.photo_check
        run: |
          python -c "
          import sys; sys.path.insert(0,'social'); import photos
          for q in ['gold bars','wall street new york','cryptocurrency']:
              u = photos._pixabay(q, 'x'); print(q, '->', 'OK ' + u[:60] if u else 'NONE')
          " | tee logs/photo_check.txt
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      - name: Delete an Instagram post
        if: inputs.ig_delete != ''
        run: python social/ig_delete.py "${{ inputs.ig_delete }}" | tee logs/ig_delete.txt
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
      - name: Facebook check
        if: inputs.fb_check
        run: python social/fb_check.py
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      - name: Wait for the posting time
        if: github.event_name == 'schedule' || inputs.from_clock
        run: |
          git pull -q --rebase origin main || true     # today's posts as of now, not as of when this run was queued
          python - <<'PY'
          import json, time, datetime as dt, sys
          now = dt.datetime.now(dt.timezone.utc)
          log = json.load(open("social/posted.json"))["posted"]
          try:
              times = json.load(open("social/best_times.json"))["times"]
          except Exception:
              times = {}
          slots = sorted([times.get("short_midday", "06:30"), times.get("short", "15:00"),
                          times.get("short_us", "18:30"), times.get("short_eve", "16:15"), times.get("short_night", "22:30")])
          # 4 Shorts a day: India noon, India evening, US lunchtime, US evening (more shots at a breakout)
          # GitHub often starts scheduled runs hours late, so catch up: post when a slot has
          # passed today (or is under 25 min away) and today's posts are fewer than slots passed.
          due, wait = 0, 0
          for t in slots:
              target = now.replace(hour=int(t[:2]), minute=int(t[3:]), second=0, microsecond=0)
              left = (target - now).total_seconds()
              if left <= 25 * 60:
                  due += 1
                  wait = max(wait, left)
          today = [p for p in log if p["date"][:10] == now.strftime("%Y-%m-%d")]
          last = max((dt.datetime.strptime(p["date"], "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=dt.timezone.utc) for p in log), default=None)
          if len(today) >= due or (last and (now - last).total_seconds() < 3 * 3600):
              print(f"nothing due now (slots {', '.join(slots)} UTC, {len(today)} posted today)"); open("/tmp/skip", "w").write("1"); sys.exit(0)
          print(f"posting Short {len(today) + 1} of today")
          if wait > 0: time.sleep(wait)
          PY
      - name: Post next Short
        if: ${{ !inputs.fb_check && !inputs.photo_check && !inputs.ig_list && !inputs.make_thumbs && !inputs.yt_stats && inputs.url_check == '' && inputs.ig_delete == '' }}
        run: |
          if [ -f /tmp/skip ]; then echo "already posted today"; exit 0; fi
          if [ "${{ inputs.rethumb }}" = "true" ]; then python social/rethumb.py; exit 0; fi
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          python social/publish.py
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          BACKFILL_ONLY: ${{ inputs.backfill_only && '1' || '' }}
          BACKFILL_DAYS: ${{ inputs.backfill_only && '8' || '3' }}
          DRY_RUN: ${{ (inputs.dry_run || vars.SOCIAL_DRY_RUN == '1') && '1' || '' }}
      - name: Save what was posted
        if: always()
        run: |
          python social/build_archive.py || true
          if [ "${{ github.event_name }}" = "schedule" ]; then python social/prune_media.py || true; fi
          git config user.name "FinanceHubW"
          git config user.email "bot@financehubw.invalid"
          git add social/posted.json site/archive.json
          for p in social/yt_playlists.json; do [ -e "$p" ] && git add "$p"; done; true
          for p in site/media/shorts; do [ -e "$p" ] && git add -A "$p"; done; true
          if [ -f logs/fb_check.json ]; then git add logs/fb_check.json; fi
          if [ -f logs/ig_delete.txt ]; then git add logs/ig_delete.txt; fi
          if [ -f logs/photo_check.txt ]; then git add logs/photo_check.txt; fi
          if [ -f logs/ig_list.txt ]; then git add logs/ig_list.txt; fi
          if [ -f logs/url_check.txt ]; then git add logs/url_check.txt; fi
          for p in site/media/shorts/thumbs; do [ -e "$p" ] && git add "$p"; done; true
          if [ -f social/yt_stats.json ]; then git add social/yt_stats.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record posted Short"
          for i in 1 2 3; do
            python3 social/git_save.py && exit 0
            sleep 5
          done
          exit 1
