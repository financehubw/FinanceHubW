name: Post Short

on:
  schedule:
    # Target 8:30 PM IST = 15:00 UTC = 11 AM New York = 4 PM London: India's evening peak and the
    # US late-morning Reels/Shorts peak in one slot. Two early triggers (GitHub often starts late);
    # the job waits until 15:00 UTC, and whichever runs second sees today's post and does nothing.
    - cron: "43 14 * * *"   # 8:13 PM IST
    - cron: "51 14 * * *"   # 8:21 PM IST (backup)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (don't post)"
        type: boolean
        default: false
      backfill_only:
        description: "Only catch up platforms that missed recent Shorts"
        type: boolean
        default: false
      rethumb:
        description: "Apply cover thumbnails to already-posted Shorts"
        type: boolean
        default: false
      photo_check:
        description: "Only test the photo source"
        type: boolean
        default: false
      ig_delete:
        description: "Instagram media id to delete"
        type: string
        default: ""
      fb_check:
        description: "Only diagnose the Facebook connection"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests google-api-python-client google-auth pillow
      - name: Photo source check
        if: inputs.photo_check
        run: |
          python -c "
          import sys; sys.path.insert(0,'social'); import photos
          for q in ['gold bars','wall street new york','cryptocurrency']:
              u = photos._pixabay(q, 'x'); print(q, '->', 'OK ' + u[:60] if u else 'NONE')
          " | tee docs/photo_check.txt
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      - name: Delete an Instagram post
        if: inputs.ig_delete != ''
        run: python social/ig_delete.py "${{ inputs.ig_delete }}" | tee docs/ig_delete.txt
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
      - name: Facebook check
        if: inputs.fb_check
        run: python social/fb_check.py
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      - name: Wait until 8:30 PM IST
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import json, time, datetime as dt, sys
          now = dt.datetime.now(dt.timezone.utc)
          log = json.load(open("social/posted.json"))["posted"]
          if any(p["date"].startswith(now.strftime("%Y-%m-%d")) for p in log):
              open("/tmp/skip", "w").write("1"); sys.exit(0)
          target = now.replace(hour=15, minute=0, second=0, microsecond=0)
          wait = (target - now).total_seconds()
          print(f"waiting {max(0, wait):.0f}s until 15:00 UTC")
          if wait > 0: time.sleep(wait)
          PY
      - name: Post next Short
        if: ${{ !inputs.fb_check && !inputs.photo_check && inputs.ig_delete == '' }}
        run: |
          if [ -f /tmp/skip ]; then echo "already posted today"; exit 0; fi
          if [ "${{ inputs.rethumb }}" = "true" ]; then python social/rethumb.py; exit 0; fi
          python social/publish.py
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          BACKFILL_ONLY: ${{ inputs.backfill_only && '1' || '' }}
          DRY_RUN: ${{ (inputs.dry_run || vars.SOCIAL_DRY_RUN == '1') && '1' || '' }}
      - name: Save what was posted
        if: always()
        run: |
          python social/build_archive.py || true
          git config user.name "FinanceHubW"
          git config user.email "bot@financehubw.invalid"
          git add social/posted.json site/archive.json
          if [ -f docs/fb_check.json ]; then git add docs/fb_check.json; fi
          if [ -f docs/ig_delete.txt ]; then git add docs/ig_delete.txt; fi
          if [ -f docs/photo_check.txt ]; then git add docs/photo_check.txt; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record posted Short"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
