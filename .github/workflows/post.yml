name: Post finance update

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub can delay runs a few minutes)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (don't post)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        run: |
          set -o pipefail
          python xbot/bot.py 2>&1 | tee bot_run.log
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_ENABLED: ${{ vars.X_ENABLED }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          LONG_POSTS: ${{ vars.LONG_POSTS }}
          POSTS_PER_RUN: ${{ vars.POSTS_PER_RUN }}
          # X is posted by hand (no paid API), so the 3-a-day credit cap no longer applies.
          MAX_POSTS_PER_DAY: ${{ vars.X_ENABLED == '1' && vars.MAX_POSTS_PER_DAY || '12' }}
          MIN_PASSES: ${{ vars.MIN_PASSES }}
          YOUTUBE_URL: ${{ vars.YOUTUBE_URL }}
          DRY_RUN: ${{ (inputs.dry_run || vars.DRY_RUN == '1') && '1' || '' }}

      - name: Keep the latest run log in the repo
        if: always()
        run: |
          mkdir -p docs
          { echo "=== run $(date -u +%FT%TZ)"; tail -n 150 bot_run.log 2>/dev/null; cat docs/last_run.log 2>/dev/null; } | head -n 1500 > docs/run.tmp && mv docs/run.tmp docs/last_run.log

      - name: Draw Story cards for new X posts
        if: always()
        run: python social/x_story.py render
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Save posting history
        if: always()
        run: |
          python social/build_archive.py || true
          git config user.name "FinanceHubW"
          git config user.email "bot@financehubw.invalid"
          for f in xbot/state.json docs/corrections.json site/tweets.json docs/last_run.log site/media/stories site/media/newsposts site/media/digests social/stories_posted.json site/archive.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update posting history"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Share new X posts as Instagram Stories
        if: always()
        timeout-minutes: 12
        run: |
          python social/x_story.py post
          python social/x_story.py feed
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          DRY_RUN: ${{ (inputs.dry_run || vars.DRY_RUN == '1') && '1' || '' }}

      - name: Save Story history
        if: always()
        run: |
          for f in social/stories_posted.json social/newsposts_posted.json social/digests_posted.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record posted Stories"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
