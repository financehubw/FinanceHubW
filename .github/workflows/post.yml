name: Post finance update

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub can delay runs a few minutes)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (don't post)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        run: |
          set -o pipefail
          python xbot/bot.py 2>&1 | tee bot_run.log
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          LONG_POSTS: ${{ vars.LONG_POSTS }}
          POSTS_PER_RUN: ${{ vars.POSTS_PER_RUN }}
          MAX_POSTS_PER_DAY: ${{ vars.MAX_POSTS_PER_DAY }}
          MIN_PASSES: ${{ vars.MIN_PASSES }}
          YOUTUBE_URL: ${{ vars.YOUTUBE_URL }}
          DRY_RUN: ${{ (inputs.dry_run || vars.DRY_RUN == '1') && '1' || '' }}

      - name: Keep the latest run log in the repo
        if: always()
        run: |
          mkdir -p docs
          { echo "run $(date -u +%FT%TZ)"; tail -n 120 bot_run.log 2>/dev/null; } > docs/last_run.log

      - name: Draw Story cards for new X posts
        if: always()
        run: python social/x_story.py render

      - name: Save posting history
        if: always()
        run: |
          python social/build_archive.py || true
          git config user.name "FinanceHubW"
          git config user.email "bot@financehubw.invalid"
          for f in xbot/state.json docs/corrections.json site/tweets.json docs/last_run.log site/media/stories social/stories_posted.json site/archive.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update posting history"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Share new X posts as Instagram Stories
        if: always()
        run: python social/x_story.py post
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          DRY_RUN: ${{ (inputs.dry_run || vars.DRY_RUN == '1') && '1' || '' }}

      - name: Save Story history
        if: always()
        run: |
          git add social/stories_posted.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record posted Stories"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
