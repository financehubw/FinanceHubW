name: Learn best posting times

# Sundays 11:37 AM IST: reads Instagram reach per post and adjusts social/best_times.json.
on:
  schedule:
    - cron: "7 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python social/best_times.py
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - run: |
          git config user.name "FinanceHubW"
          git config user.email "bot@financehubw.invalid"
          git add social/best_times.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update best posting times"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push
