name: Learn carousel

# Mon / Wed / Fri from 4:37 PM IST (retries 6:37 and 8:37 if Instagram needs a 2h gap): a save-worthy educational carousel on Instagram and the Facebook Page.
on:
  schedule:
    - cron: "7 11,13,15 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Draw only, don't post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: edu
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt pillow numpy
      - run: python social/edu.py
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: edu-preview
          path: site/media/edu
      - run: |
          git config user.name "FinanceHubW"
          git config user.email "bot@financehubw.invalid"
          git add social/edu_posted.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record learn carousel"
          python3 social/git_save.py
