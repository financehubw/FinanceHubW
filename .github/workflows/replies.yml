name: Reply to comments

# Every hour: short, friendly replies to new comments on Instagram and YouTube (free models).
on:
  schedule:
    - cron: "29 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: replies
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt google-api-python-client google-auth
      - run: python social/replies.py
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - run: |
          git config user.name "FinanceHubW"
          git config user.email "bot@financehubw.invalid"
          git add social/replied.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record comment replies"
          for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
