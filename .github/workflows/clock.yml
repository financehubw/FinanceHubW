name: Clock

# GitHub drops many scheduled runs, so this is the dependable timer for the Shorts slots: it waits for the
# next slot, starts "Post Short" (which still checks that a post is due), then starts itself again.
# The cron below only restarts the chain if it ever stops.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: clock
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            social/clock.py
            social/best_times.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Wait for the next slot, post, hand over
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: python social/clock.py
