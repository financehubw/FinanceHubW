name: Weekly long video

# Sundays 6:07 PM IST: the week's Shorts become one widescreen episode with chapters (long videos win
# subscribers and count toward YouTube's watch-hours goal). Manual runs can pick the Shorts and title.
on:
  schedule:
    - cron: "37 12 * * 0"
  workflow_dispatch:
    inputs:
      files:
        description: "Short file names, space separated (empty = this week's)"
        type: string
        default: ""
      title:
        description: "Video title (empty = automatic)"
        type: string
        default: ""
      dry_run:
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: long-video
  cancel-in-progress: false

jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # full history: cleaned-out Short videos are restored from it
          filter: blob:none
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install -q pillow google-api-python-client google-auth
      - name: Build and upload
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FILES: ${{ inputs.files }}
          TITLE: ${{ inputs.title }}
        run: |
          mkdir -p docs
          args=()
          [ -n "$FILES" ] && args+=(--files $FILES)
          [ -n "$TITLE" ] && args+=(--title "$TITLE")
          python social/compile_long.py "${args[@]}" 2>&1 | tee docs/long_video.log
      - name: Save
        if: always()
        run: |
          git config user.name "FinanceHubW"
          git config user.email "bot@financehubw.invalid"
          for p in docs/long_video.log social/long_posted.json social/yt_playlists.json; do [ -e "$p" ] && git add "$p"; done; true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Weekly long video"
          python3 social/git_save.py
