name: Post magazine

on:
  push:
    branches: [main]
    paths:
      - "social/magazine_queue.json"
      - "social/daily_queue.json"
  schedule:
    - cron: "23 6 * * *"   # every day 11:53 AM IST: retries an edition that did not go out
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (don't post)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Post editions that are ready
        run: python social/publish_magazine.py
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          DRY_RUN: ${{ (inputs.dry_run || vars.SOCIAL_DRY_RUN == '1') && '1' || '' }}
      - name: Save what was posted
        if: always()
        run: |
          git config user.name "FinanceHubW"
          git config user.email "bot@financehubw.invalid"
          git add social/magazine_posted.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record posted magazine edition"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
